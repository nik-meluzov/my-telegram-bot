Яндек:
  name: my-telegram-bot
  description: PDF to Excel converter
  version: "1.0"
build:
  requirements: requirements.txt
  useCache: true
run:
  command: uvicorn app:app --host 0.0.0.0 --port 80
persistenceMount: /data
containerPort: "80"
russianTrustedCa: false
singleton: true
zeroDowntime: false
